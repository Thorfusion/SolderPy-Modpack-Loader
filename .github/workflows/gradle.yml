name: Build and publish development artifacts

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**/README.md'
  pull_request:
    paths-ignore:
      - '**/README.md'
  # Trusted PRs run from the base branch's workflow so credentials can be used.
  # Unknown contributors remain isolated on a GitHub-hosted runner.
  pull_request_target:
    paths-ignore:
      - '**/README.md'
  schedule:
    - cron: '0 12 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: >-
      ${{ (github.event_name == 'pull_request' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      (github.event_name == 'pull_request_target' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)) ||
      !contains(fromJSON('["pull_request","pull_request_target"]'), github.event_name) }}
    name: >-
      Build (${{ github.event_name == 'pull_request' && 'GitHub-hosted' || 'self-hosted' }})
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || 'self-hosted' }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          repository: >-
            ${{ github.event_name == 'pull_request_target' &&
            github.event.pull_request.head.repo.full_name || github.repository }}
          ref: >-
            ${{ github.event_name == 'pull_request_target' &&
            github.event.pull_request.head.sha || '' }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Determine build version
        id: artifact
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: |
          base_version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r' | tail -n 1)"
          if [[ -z "$base_version" ]]; then
            echo 'Could not determine mod_version from gradle.properties.' >&2
            exit 1
          fi

          case "$GITHUB_EVENT_NAME" in
            pull_request|pull_request_target)
              build_suffix="pr-${PR_NUMBER}-${GITHUB_RUN_NUMBER}"
              ;;
            *)
              build_suffix="$GITHUB_RUN_NUMBER"
              ;;
          esac

          version="${base_version}-${build_suffix}"
          echo "suffix=$build_suffix" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=build/libs/solderpy-loader-${version}.jar" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew --no-daemon --stacktrace clean check shadowJar
        env:
          BUILD_VER: ${{ steps.artifact.outputs.suffix }}

      - name: Validate packaged artifact
        shell: bash
        run: >-
          bash .github/scripts/validate-release-artifact.sh
          '${{ steps.artifact.outputs.file }}'
          '${{ steps.artifact.outputs.version }}'

      - name: Publish development version to Maven
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          BUILD_VER: ${{ steps.artifact.outputs.suffix }}
          MAVEN_PUBLISH: 'true'
          MAVEN_URL: ${{ secrets.MAVEN_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_TOKEN }}
          MAVEN_REPO: ${{ secrets.MAVEN_DEVREPO }}
        run: |
          if [[ -z "$MAVEN_URL" ]]; then
            echo 'MAVEN_URL is not configured; skipping development Maven publication.'
            exit 0
          fi
          ./gradlew --no-daemon --no-configuration-cache --stacktrace publish

      - name: Upload development artifact
        uses: actions/upload-artifact@v7
        with:
          name: solderpy-loader-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.artifact.outputs.file }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
