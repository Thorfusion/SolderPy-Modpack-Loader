name: Select an available runner

on:
  workflow_call:
    inputs:
      allow-self-hosted:
        description: Whether this event may use a self-hosted runner
        type: boolean
        default: true
      probe-ref:
        description: Trusted branch or tag containing the runner probe
        type: string
        required: true
    outputs:
      runner:
        description: Self-hosted when available, otherwise GitHub-hosted Ubuntu
        value: ${{ jobs.select.outputs.runner }}

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      runner: ${{ steps.select.outputs.runner || 'ubuntu-24.04' }}

    steps:
      - name: Probe the self-hosted runner
        id: select
        # A failed availability check must not prevent the actual build.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_SELF_HOSTED: ${{ inputs.allow-self-hosted }}
          PROBE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PROBE_REF: ${{ inputs.probe-ref }}
        run: |
          fallback='ubuntu-24.04'
          selected="$fallback"
          echo "runner=$fallback" >> "$GITHUB_OUTPUT"

          if [[ "$ALLOW_SELF_HOSTED" != 'true' ]]; then
            echo 'This event uses a GitHub-hosted runner without probing self-hosted runners.'
            exit 0
          fi

          probe_title="Self-hosted runner probe ${PROBE_ID}"
          probe_run_id=''

          if ! timeout 10s gh workflow run runner-probe.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$PROBE_REF" \
            --field "probe_id=${PROBE_ID}"; then
            echo 'Could not dispatch the self-hosted probe; using GitHub-hosted runner.'
            exit 0
          fi

          # The probe can remain queued indefinitely while runners are offline.
          # Bound both individual API calls and the total time spent waiting.
          deadline=$((SECONDS + 45))
          while (( SECONDS < deadline )); do
            if [[ -z "$probe_run_id" ]]; then
              runs_json="$(
                timeout 5s gh api \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/runner-probe.yml/runs?event=workflow_dispatch&per_page=20" \
                  2>/dev/null || true
              )"
              probe_run_id="$(
                jq -r --arg title "$probe_title" \
                  '[.workflow_runs[]? | select(.display_title == $title)][0].id // empty' \
                  <<< "$runs_json" 2>/dev/null || true
              )"
            else
              run_json="$(
                timeout 5s gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${probe_run_id}" \
                  2>/dev/null || true
              )"
              status="$(jq -r '.status // ""' <<< "$run_json" 2>/dev/null || true)"
              conclusion="$(jq -r '.conclusion // ""' <<< "$run_json" 2>/dev/null || true)"

              if [[ "$status" == 'completed' ]]; then
                if [[ "$conclusion" == 'success' ]]; then
                  selected='self-hosted'
                fi
                break
              fi
            fi
            sleep 2
          done

          if [[ "$selected" == "$fallback" && -n "$probe_run_id" ]]; then
            timeout 5s gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${probe_run_id}/cancel" \
              >/dev/null 2>&1 || true
          fi

          echo "Selected runner: $selected"
          echo "runner=$selected" >> "$GITHUB_OUTPUT"
