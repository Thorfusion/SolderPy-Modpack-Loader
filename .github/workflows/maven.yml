name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  select-runner:
    name: Select an available runner
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    outputs:
      runner: ${{ steps.select.outputs.runner }}

    steps:
      - name: Probe the self-hosted runner
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          PROBE_REF: ${{ github.event.release.tag_name }}
        run: |
          fallback='ubuntu-24.04'
          selected="$fallback"
          probe_title="Self-hosted runner probe ${PROBE_ID}"
          probe_run_id=''

          if ! gh workflow run runner-probe.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$PROBE_REF" \
            --field "probe_id=${PROBE_ID}"; then
            echo 'Could not dispatch the self-hosted probe; using GitHub-hosted runner.'
            echo "runner=$selected" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for _ in {1..15}; do
            runs_json="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/runner-probe.yml/runs?event=workflow_dispatch&per_page=20" \
                2>/dev/null || true
            )"
            probe_run_id="$(
              jq -r --arg title "$probe_title" \
                '[.workflow_runs[]? | select(.display_title == $title)][0].id // empty' \
                <<< "$runs_json"
            )"
            if [[ -n "$probe_run_id" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -n "$probe_run_id" ]]; then
            for _ in {1..15}; do
              run_json="$(
                gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${probe_run_id}" \
                  2>/dev/null || true
              )"
              status="$(jq -r '.status // ""' <<< "$run_json")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$run_json")"

              if [[ "$status" == 'completed' ]]; then
                if [[ "$conclusion" == 'success' ]]; then
                  selected='self-hosted'
                fi
                break
              fi
              sleep 2
            done
          fi

          if [[ "$selected" == "$fallback" && -n "$probe_run_id" ]]; then
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${probe_run_id}/cancel" \
              >/dev/null 2>&1 || true
          fi

          echo "Selected runner: $selected"
          echo "runner=$selected" >> "$GITHUB_OUTPUT"

  build:
    name: Build both distributions, publish Maven, and attach GitHub assets
    needs: select-runner
    runs-on: ${{ needs.select-runner.outputs.runner }}
    timeout-minutes: 30
    environment: release
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      platform_artifact_name: ${{ steps.artifact.outputs.platform_name }}
      project_version: ${{ steps.artifact.outputs.version }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Determine artifact name
        id: artifact
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r' | tail -n 1)"
          if [[ -z "$version" ]]; then
            echo 'Could not determine mod_version from gradle.properties.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=solderpy-loader-${version}.jar" >> "$GITHUB_OUTPUT"
          echo "file=build/libs/solderpy-loader-${version}.jar" >> "$GITHUB_OUTPUT"
          echo "platform_name=solderpy-loader-${version}-file-only.jar" >> "$GITHUB_OUTPUT"
          echo "platform_file=build/libs/solderpy-loader-${version}-file-only.jar" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches the project version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PROJECT_VERSION: ${{ steps.artifact.outputs.version }}
        run: |
          if [[ "$RELEASE_TAG" != "$PROJECT_VERSION" ]]; then
            echo "Release tag '$RELEASE_TAG' must equal mod_version '$PROJECT_VERSION'." >&2
            exit 1
          fi

      - name: Build and test release
        run: ./gradlew --no-daemon --stacktrace clean check shadowJar fileOnlyJar
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true

      - name: Validate packaged artifact
        shell: bash
        run: >-
          bash .github/scripts/validate-release-artifact.sh
          '${{ steps.artifact.outputs.file }}'
          '${{ steps.artifact.outputs.version }}'

      - name: Validate file-only platform artifact
        shell: bash
        run: >-
          bash .github/scripts/validate-release-artifact.sh
          '${{ steps.artifact.outputs.platform_file }}'
          '${{ steps.artifact.outputs.version }}'
          file-only

      - name: Publish both builds to Reposilite
        shell: bash
        env:
          MAVEN_PUBLISH: 'true'
          MAVEN_URL: ${{ secrets.MAVEN_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_TOKEN }}
          MAVEN_REPO: ${{ secrets.MAVEN_REPO }}
        run: |
          : "${MAVEN_URL:?Configure MAVEN_URL with the Reposilite base or repository URL.}"
          : "${MAVEN_USERNAME:?Configure MAVEN_USERNAME with the Reposilite token name.}"
          : "${MAVEN_PASSWORD:?Configure MAVEN_TOKEN with the Reposilite token secret.}"
          ./gradlew --no-daemon --no-configuration-cache --stacktrace publish

      - name: Attach artifact to GitHub release
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          github-token: ${{ github.token }}
          github-tag: ${{ github.event.release.tag_name }}
          github-generate-changelog: false
          files: |
            ${{ steps.artifact.outputs.file }}
            ${{ steps.artifact.outputs.platform_file }}
          version: ${{ steps.artifact.outputs.version }}

      - name: Save release artifact for publishing jobs
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.event.release.tag_name }}
          path: |
            ${{ steps.artifact.outputs.file }}
            ${{ steps.artifact.outputs.platform_file }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-modrinth:
    name: Publish Modrinth
    needs: [select-runner, build]
    runs-on: ${{ needs.select-runner.outputs.runner }}
    timeout-minutes: 30
    environment: release

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.event.release.tag_name }}
          path: output

      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: 5LpwENAj
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-dependencies: |
            zCFNaupz(required)
          files: output/${{ needs.build.outputs.platform_artifact_name }}
          name: SolderPy Modpack Loader ${{ needs.build.outputs.project_version }}
          version: ${{ needs.build.outputs.project_version }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          modrinth-loaders: java-agent
          game-versions: '>=1.6.4'
          game-version-filter: releases
          java: '8'
          environment: client | server
          retry-attempts: 2

  publish-curseforge:
    name: Publish CurseForge
    needs: [select-runner, build]
    runs-on: ${{ needs.select-runner.outputs.runner }}
    timeout-minutes: 30
    environment: release

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.event.release.tag_name }}
          path: output

      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          curseforge-id: '1702825'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          # Relauncher's CurseForge project serves its native-free -curseforge edition.
          curseforge-dependencies: |
            1491728(required)
          files: output/${{ needs.build.outputs.platform_artifact_name }}
          name: SolderPy Modpack Loader ${{ needs.build.outputs.project_version }}
          version: ${{ needs.build.outputs.project_version }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          loaders: |
            forge
            neoforge
            fabric
            quilt
          game-versions: '>=1.6.4'
          game-version-filter: releases
          java: '8'
          environment: client | server
          retry-attempts: 2
