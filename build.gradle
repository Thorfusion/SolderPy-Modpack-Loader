import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import org.gradle.authentication.http.BasicAuthentication

plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.thorfusion'
def baseVersion = providers.gradleProperty('mod_version').get()
def buildSuffix = System.getenv('BUILD_VER')
version = buildSuffix == null || buildSuffix.trim().isEmpty()
    ? baseVersion
    : "${baseVersion}-${buildSuffix.trim()}"

repositories {
    mavenCentral()
}

configurations {
    legacyCompatibilityTest
}

sourceSets {
    fileOnly {
        compileClasspath = sourceSets.main.output + configurations.compileClasspath
    }
}

dependencies {
    compileOnly 'com.juanmuscaria:relauncher-core:1.1.1'

    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'commons-io:commons-io:2.20.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    legacyCompatibilityTest 'commons-io:commons-io:2.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('processResources') {
    from('assets/solderpy-loader-logo.png') {
        into 'assets/solderpyloader'
        rename { 'icon.png' }
    }
}

jar {
    archiveBaseName = 'solderpy-loader'
    archiveClassifier = 'thin'
    manifest {
        attributes(
            'Premain-Class': 'io.github.thorfusion.solderpyloader.SolderPyAgent',
            'Can-Redefine-Classes': 'false',
            'Can-Retransform-Classes': 'false',
            'Implementation-Title': 'SolderPy Modpack Loader',
            'Implementation-Version': project.version,
            'SolderPy-Distribution': 'universal'
        )
    }

    from('LICENSE') {
        into 'META-INF'
    }
}

tasks.withType(ShadowJar).configureEach {
    archiveBaseName = 'solderpy-loader'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    relocate 'com.google.gson', 'io.github.thorfusion.solderpyloader.internal.gson'
    relocate 'org.apache.commons.compress', 'io.github.thorfusion.solderpyloader.internal.compress'
    relocate 'org.apache.commons.io', 'io.github.thorfusion.solderpyloader.internal.io'

    exclude 'META-INF/NOTICE', 'META-INF/NOTICE.txt'
    from('LICENSE') {
        into 'META-INF'
    }
    from('THIRD-PARTY-NOTICES.md') {
        into 'META-INF'
    }
}

shadowJar {
    archiveClassifier = ''
}

tasks.register('fileOnlyJar', ShadowJar) {
    group = 'build'
    description = 'Builds the file-only distribution for CurseForge and Modrinth.'
    archiveClassifier = 'file-only'
    configurations = [project.configurations.runtimeClasspath]
    from(sourceSets.main.output) {
        exclude 'io/github/thorfusion/solderpyloader/LoaderDistribution.class'
        exclude 'io/github/thorfusion/solderpyloader/BootstrapClient*.class'
        exclude 'io/github/thorfusion/solderpyloader/ManifestVerifier*.class'
    }
    from sourceSets.fileOnly.output
    manifest {
        attributes(tasks.named('jar').get().manifest.attributes + [
            'SolderPy-Distribution': 'file-only'
        ])
    }
}

tasks.register('fileOnlyArtifactSmokeTest', JavaExec) {
    dependsOn tasks.named('fileOnlyJar'), tasks.named('testClasses')
    group = 'verification'
    description = 'Verifies the packaged file-only loader installs local manifests and rejects the API.'
    classpath = files(
        sourceSets.test.output,
        tasks.named('fileOnlyJar').flatMap { it.archiveFile }
    )
    mainClass = 'io.github.thorfusion.solderpyloader.FileOnlyArtifactProbe'
    systemProperty 'java.awt.headless', 'true'
}

tasks.register('legacyClasspathSmokeTest', JavaExec) {
    dependsOn tasks.named('shadowJar'), tasks.named('testClasses')
    group = 'verification'
    description = 'Verifies the packaged loader beside Minecraft 1.7.10-era Commons IO.'
    classpath = files(
        sourceSets.test.output,
        configurations.legacyCompatibilityTest,
        tasks.named('shadowJar').flatMap { it.archiveFile }
    )
    mainClass = 'io.github.thorfusion.solderpyloader.PackagedArtifactProbe'
}

tasks.named('check') {
    dependsOn tasks.named('legacyClasspathSmokeTest')
    dependsOn tasks.named('fileOnlyArtifactSmokeTest')
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
    dependsOn tasks.named('fileOnlyJar')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact tasks.named('shadowJar')
            artifact tasks.named('fileOnlyJar')
            artifactId = 'solderpy-loader'

            pom {
                name = 'SolderPy Modpack Loader'
                description = 'Cross-loader Minecraft modpack bootstrap agent for solder.py modpacks'
                url = 'https://github.com/Thorfusion/SolderPy-Modpack-Loader'
                licenses {
                    license {
                        name = 'All Rights Reserved'
                        url = 'https://github.com/Thorfusion/SolderPy-Modpack-Loader/blob/main/LICENSE'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/Thorfusion/SolderPy-Modpack-Loader.git'
                    developerConnection = 'scm:git:ssh://git@github.com/Thorfusion/SolderPy-Modpack-Loader.git'
                    url = 'https://github.com/Thorfusion/SolderPy-Modpack-Loader'
                }
            }
        }
    }

    repositories {
        maven {
            name = 'releaseRepository'
            def remotePublish = 'true'.equalsIgnoreCase(System.getenv('MAVEN_PUBLISH'))
            def baseUrl = System.getenv('MAVEN_URL')
            def repositoryName = System.getenv('MAVEN_REPO')
            if (!remotePublish) {
                url = layout.buildDirectory.dir('maven-repository')
            } else {
                if (baseUrl == null || baseUrl.trim().isEmpty()) {
                    throw new GradleException('MAVEN_URL is required when MAVEN_PUBLISH=true')
                }
                def normalized = baseUrl.trim().replaceAll('/+$', '')
                if (repositoryName != null && !repositoryName.trim().isEmpty()) {
                    normalized += '/' + repositoryName.trim().replaceAll('^/+|/+$', '')
                }
                def tokenName = System.getenv('MAVEN_USERNAME')
                def tokenSecret = System.getenv('MAVEN_PASSWORD')
                if (tokenName == null || tokenName.trim().isEmpty() ||
                    tokenSecret == null || tokenSecret.isEmpty()) {
                    throw new GradleException(
                        'MAVEN_USERNAME and MAVEN_PASSWORD must contain the Reposilite token name and secret'
                    )
                }
                url = uri(normalized)
                credentials {
                    username = tokenName
                    password = tokenSecret
                }
                authentication {
                    basic(BasicAuthentication)
                }
            }
        }
    }
}
